name: Publish APK release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.33
        required: true
        type: string
      apk_url:
        description: Public URL of the APK to package into the release
        required: true
        type: string
      release_name:
        description: Release title
        required: false
        default: Medivac One Android release
        type: string
      notes:
        description: Release notes in Markdown
        required: false
        default: Published from the free-track release workflow.
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output medivac-one.apk "$APK_URL"
          test -s medivac-one.apk
          file medivac-one.apk

      - name: Create checksum manifest
        run: |
          set -euo pipefail
          sha256sum medivac-one.apk | tee SHA256SUMS.txt

      - name: Validate Android package structure
        run: |
          set -euo pipefail
          unzip -tqq medivac-one.apk
          unzip -l medivac-one.apk | grep -q 'AndroidManifest.xml'
          unzip -l medivac-one.apk | grep -q 'classes.dex'
          # v2/v3 APK signatures live in the APK signing block rather than
          # META-INF; apksigner verification can be added when the Android SDK
          # is available on the runner.
          unzip -l medivac-one.apk | grep -qE 'classes[0-9]*\.dex'
          bytes="$(stat -c '%s' medivac-one.apk)"
          test "$bytes" -gt 1000000
          echo "Validated APK container and signing metadata: $bytes bytes"

      - name: Verify checksum manifest
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          gh release create "$TAG" medivac-one.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME $TAG" \
            --notes "$NOTES"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Summarize release
        run: |
          {
            echo '### APK release published'
            echo
            echo "- Tag: ${{ inputs.tag }}"
            echo '- Asset: medivac-one.apk'
            echo '- Integrity: SHA256SUMS.txt'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up downloaded APK
        if: always()
        run: rm -f medivac-one.apk SHA256SUMS.txt
